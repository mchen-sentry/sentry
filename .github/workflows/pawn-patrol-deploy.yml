name: pawn-patrol-deploy
# Deploys the Pawn Patrol prototype (static SPA + live-game WebSocket server)
# to Cloud Run on every push to master of THIS FORK (mchen-sentry/sentry).
on:
  push:
    branches: [master]
concurrency:
  group: pawn-patrol-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'mchen-sentry/sentry'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/714494020823/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: gha-sentry-gambit@devinfra-remote-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push image
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          docker build -f hackweek-deploy/Dockerfile \
            -t us-west1-docker.pkg.dev/devinfra-remote-dev/cloud-run-source-deploy/pawn-patrol:${{ github.sha }} .
          docker push us-west1-docker.pkg.dev/devinfra-remote-dev/cloud-run-source-deploy/pawn-patrol:${{ github.sha }}
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: sentry-gambit
          project_id: devinfra-remote-dev
          region: us-west1
          image: us-west1-docker.pkg.dev/devinfra-remote-dev/cloud-run-source-deploy/pawn-patrol:${{ github.sha }}
          # game rooms are in-memory on one instance; deploys reset live games
          flags: --max-instances=1 --timeout=3600 --memory=512Mi
